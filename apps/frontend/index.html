<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 옛 주소(Firebase 기본 주소 · www · 옛 사이트)로 들어오면 번들보다 먼저 정식 주소로 옮긴다(2026-11-01 — 번들을 다 받은 뒤에야
         옮기던 탓에 느린 회선에서 빈 화면이 4초 갔다). async 라 정식 주소의 첫 화면은 이 파일을 기다리지 않는다.
         번들의 src/lib/canonicalHost.ts 가 같은 목록으로 뒤를 받친다. -->
    <script src="/canonical-host.js" async></script>
    <!-- 선언이 없으면 브라우저가 /favicon.ico 를 스스로 찾아가 404 를 낸다 —
         페이지를 열 때마다 콘솔 에러 1건이 그래서 생겼다(2026-09-08 렌더 검증). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 앱스토어 출시 대신 웹앱(PWA)으로 먼저 간다(2026-10-05) — 홈 화면에 추가하면 앱처럼 뜬다.
         심사·개발자 계정·인앱결제 정책을 지금 질 이유가 없다(docs/decision-lightweight-first-2026-10-05.md §4).
         ⚠ 서비스 워커는 일부러 두지 않는다. 캐시가 옛 빌드를 붙잡으면 09-13 의 "배포했는데 옛 화면"
           사고가 되풀이된다(apps/backend/app/main.py FrontendFiles 의 no-cache 정책). 아이콘은
           scripts/build_pwa_icons.py 가 만든다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3A5A98" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PlaceOS" />
    <title>PlaceOS - 창업자를 위한 부동산 앱</title>
    <meta name="description" content="창업할 업종과 사업 방향을 저장하고, 상권 탐색부터 입점 계산과 검증 program 준비까지 이어가는 PlaceOS 작업 공간." />
    <!-- 정식 주소 placeos.co.kr(2026-11-01 — DNS·인증서·지도 인증 확인 뒤 정식으로 삼았다. Firebase 기본 주소는 더 쓰지 않는다
         → src/lib/canonicalHost.ts). 공유 미리보기·검색 결과가 이 주소를 쓰게 한다. -->
    <link rel="canonical" href="https://placeos.co.kr/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PlaceOS - 창업자를 위한 부동산 앱" />
    <meta property="og:description" content="상권 탐색부터 공간 선택, 입점 비용 계산과 검증 준비까지 이어가는 PlaceOS." />
    <meta property="og:url" content="https://placeos.co.kr/" />
    <meta property="og:image" content="https://placeos.co.kr/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- JS 를 못 돌리는 방문자·크롤러용. 화면은 React 가 그리지만, 홈페이지에서 처리방침으로 가는 링크는
         JS 없이도 보여야 한다(구글 OAuth 앱 게시 요건). -->
    <noscript>
      <main style="max-width:640px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>PlaceOS</h1>
        <p>창업할 업종과 사업 방향을 저장하고, 상권 탐색부터 입점 계산과 검증 program 준비까지 이어가는 작업 공간입니다.
           이 서비스는 JavaScript 가 켜져 있어야 쓸 수 있습니다.</p>
        <p><a href="/privacy.html">개인정보 처리방침</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
