# PlaceOS 배포 — main 의 CI 가 **전부 통과한 뒤** Cloud Run 으로 나간다
#
# ## 왜 이 파일이 필요한가
# 2026-08-28 Cloud Run 전환 전까지는 `git push` 가 예전 서버리스 호스팅으로 **자동 배포**됐다.
# 전환하면서 그 자동 배포가 사라지므로, 이 워크플로가 없으면 **푸시해도 프로덕션이
# 안 바뀐다.** 코드는 최신인데 서비스는 옛날 것이 도는, 조용한 어긋남이 생긴다 —
# 이 저장소가 반복해 잡아 온 실패 양식이라 자동화로 막는다.
#
# ## 장기 키를 쓰지 않는다
# Workload Identity 연합(WIF)으로 GitHub OIDC 토큰을 GCP 서비스계정으로 교환한다.
# 저장소에 서비스계정 키(JSON)를 두지 않는다 — 유출되면 취소 전까지 계속 유효한 물건이다.
# 공급자에 `assertion.repository=='seoghyeonbag36-max/placeos'` 조건이 걸려 있어
# **다른 저장소의 토큰으로는 이 서비스계정을 못 빌린다.**
# (2026-10-06 `gcloud iam workload-identity-pools providers list` 로 확인 — 이 주석은 저장소
#  개명 전 이름 `spaceos` 를 적고 있었다.)
#
# ## CI 가 통과해야만 배포한다 (2026-10-06 — `push` 에서 `workflow_run` 으로)
# 종전에는 `on: push` 로 CI 와 **나란히** 돌았고, 순서를 강제할 수 없어 여기서 백엔드 pytest 만
# 한 번 더 돌렸다. 그래서 프론트 lint·vitest, data pytest, 최소 의존성 임포트가 빨개도 배포는 나갔다
# (docs/finding-project-review-4roles-2026-10-06.md §4-2). 이제 CI 워크플로가 끝나면 그 결과를 보고 돈다:
#   · CI 결론이 success 이고, main 에 대한 **push** 로 돈 CI 이고, **이 저장소**의 커밋일 때만 배포한다.
#     뒤의 두 조건이 빠지면 포크 PR 이 `main` 이라는 이름의 브랜치로 돌린 CI 가 배포를 일으킬 수 있다.
#   · 배포하는 커밋은 CI 가 검사한 `workflow_run.head_sha` 로 고정한다. `github.sha` 는 이 이벤트에서
#     "지금 main 의 꼭대기"라 CI 가 본 커밋과 다를 수 있다.
#   · `workflow_run` 은 **기본 브랜치에 있는** 이 파일로만 트리거된다 — 이 파일을 고친 PR 은 머지된 뒤에야 효력이 난다.
# 아래 `test` 잡(백엔드 pytest)은 일부러 남긴다: 수동 실행(workflow_dispatch)에는 앞선 CI 가 없고,
# 배포 직전 같은 커밋으로 한 번 더 도는 2분이 빨간 코드가 나가는 것보다 싸다.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:        # 수동 재배포(롤백 후 재시도 등) — 앞선 CI 없이 `test` 잡만 거친다

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false   # 배포는 중간에 끊지 않는다

# ⚠ 2026-09-12 브랜드를 SpaceOS → PlaceOS 로 바꿨지만 아래 이름들은 **이미 만들어진 리소스**라 그대로 둔다.
#   글자만 PlaceOS 로 바꾸면 배포가 존재하지 않는 리소스를 찾는다. 옮기려면
#   GCP 프로젝트·Artifact Registry·Cloud Run 서비스를 먼저 새로 만들어야 한다.
env:
  PROJECT_ID: spaceos-digital-twin
  REGION: us-central1
  SERVICE: spaceos
  IMAGE: us-central1-docker.pkg.dev/spaceos-digital-twin/spaceos/web
  # 배포할 커밋 — CI 가 검사한 커밋(workflow_run) 또는 수동 실행이 고른 커밋(workflow_dispatch).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  test:
    name: 배포 전 테스트
    # 게이트는 첫 잡에 둔다 — 여기서 건너뛰면 `needs: test` 인 배포도 함께 건너뛴다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r apps/backend/requirements.txt
      - name: pytest
        working-directory: apps/backend
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

  deploy:
    name: Cloud Run 배포
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # WIF 토큰 발급에 필요하다
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: GCP 인증 (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 네이버 지도 키는 **빌드 타임** 변수라(Vite 가 번들에 인라인) 여기서 넣어야 한다.
      # 런타임 환경변수로는 못 들어간다. Dockerfile 이 빈 값이면 빌드를 중단시킨다.
      - name: 이미지 빌드 (Cloud Build)
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_NAVER_KEY='${{ secrets.VITE_NAVER_MAPS_KEY_ID }}',_IMAGE=${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            --project=${{ env.PROJECT_ID }}

      # 런타임 비밀값(JWT_SECRET·ADMIN_TOKEN·LLM_API_KEY)은 **건드리지 않는다.**
      # 서비스에 이미 설정돼 있고, 여기서 --set-env-vars 를 쓰면 기존 값이 통째로 날아간다
      # (JWT_SECRET 이 사라지면 prod 가드가 기동을 막아 서비스가 죽는다).
      - name: Cloud Run 배포
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ env.DEPLOY_SHA }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --project=${{ env.PROJECT_ID }}

      # 배포가 "성공"해도 실제로 도는지는 별개다. 눌러 본다.
      - name: 배포 검증
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
                  --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
                  --format='value(status.url)')
          echo "서비스 URL: $URL"

          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$URL/health")
          test "$code" = "200" || { echo "health 실패: $code"; exit 1; }

          # 200 인데 데이터가 비어 있는 고장을 잡는다 — 이 저장소의 반복 실패 양식이다.
          body=$(curl -sSL -m 60 "$URL/api/v1/commercial-districts")
          echo "$body" | grep -q '"vacancy_source":"gold"' \
            || { echo "분석 API 에 gold 데이터가 없다"; exit 1; }

          n=$(echo "$body" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          test "$n" -ge 50 || { echo "상권이 ${n}곳뿐이다 (54 기준 50 미만)"; exit 1; }

          echo "검증 통과: 상권 ${n}곳 · gold 데이터 있음"
